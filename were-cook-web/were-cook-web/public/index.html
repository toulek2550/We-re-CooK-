<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We're CooK?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3a2233; --plum2:#4f2f45; --cream:#fff7ec; --cream2:#f6e6d6; --ink:#3a2233; --muted:#86697a;
  --tomato:#ff5a4e; --tomato-d:#d33b32; --butter:#ffc933; --butter-d:#d9a012; --basil:#4caf50; --basil-d:#2f8a36;
  --lilac:#b9a2e6; --sky:#7cc6ff; --glass:rgba(255,247,236,.86); --line:rgba(58,34,51,.12);
  --shadow:0 18px 40px -12px rgba(40,12,34,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Fredoka","Itim","Leelawadee UI",Tahoma,system-ui,sans-serif;
  color:var(--ink); background:#2a1a2a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#2e1f2b; --cream2:#3b2837; --ink:#fff1e8; --muted:#d2b4c6; --glass:rgba(46,31,43,.86); --line:rgba(255,241,232,.14);}}
:root[data-theme="dark"]{--cream:#2e1f2b; --cream2:#3b2837; --ink:#fff1e8; --muted:#d2b4c6; --glass:rgba(46,31,43,.86); --line:rgba(255,241,232,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;line-height:1.45;overflow-x:hidden;background:#2a1a2a}
h1,h2,h3{margin:0;line-height:1.15;font-weight:600}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
svg.ic{display:block;overflow:visible}

/* ---------- illustrated background ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;transform:scale(1.04);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(42,20,40,.05),rgba(42,20,40,.55) 80%)}
body.in-game .veil{background:rgba(30,14,28,.72)}
body.in-game .shell{max-width:1480px;padding-top:6px}
body.in-game .top{margin-bottom:6px}
.bokeh{animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-26px)}}

.shell{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:14px clamp(12px,3vw,28px) 28px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{white-space:nowrap;font-weight:700;font-size:1.25rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.brand svg{width:34px;height:34px}
.spacer{flex:1}
.conn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;padding:5px 12px;border-radius:999px;font-size:.88rem}
.conn i{width:9px;height:9px;border-radius:50%;background:#aaa;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.conn.on i{background:#6ee07a;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(110,224,122,.05)}}

.card{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-radius:28px;padding:20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.35)}
.muted{color:var(--muted)}
.label{font-size:.9rem;color:var(--muted);margin-bottom:8px}

/* candy buttons */
.btn{--c:var(--butter);--d:var(--butter-d);border:0;border-radius:18px;padding:12px 20px;font-weight:600;font-size:1.05rem;background:var(--c);color:#3a2233;
  box-shadow:0 6px 0 var(--d),0 12px 18px -8px rgba(40,12,34,.5);transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;position:relative;top:0;user-select:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d),0 4px 8px -4px rgba(40,12,34,.5)}
.btn.red{--c:var(--tomato);--d:var(--tomato-d);color:#fff}
.btn.green{--c:var(--basil);--d:var(--basil-d);color:#fff}
.btn.soft{--c:var(--cream2);--d:rgba(58,34,51,.18);color:var(--ink)}
.btn.big{font-size:1.25rem;padding:16px 26px;border-radius:22px}
.btn:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed;transform:none}
.btn .ic{width:26px;height:26px;display:inline-block;vertical-align:-6px;margin-right:6px}

/* ---------- lobby ---------- */
.hero{position:relative;text-align:center;padding:10px 0 22px;color:#fff}
.logo{font-size:clamp(3rem,10vw,6rem);font-weight:700;letter-spacing:-1px;line-height:.95;
  text-shadow:0 4px 0 #c23a55,0 8px 0 #7b2346,0 18px 30px rgba(0,0,0,.35);color:#fff4d6}
.logo span{display:inline-block;animation:letter .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes letter{from{transform:translateY(40px) scale(.4);opacity:0}}
.tag{font-size:clamp(1rem,2.4vw,1.25rem);margin-top:12px;opacity:.92}
.floaty{position:absolute;width:clamp(54px,8vw,92px);height:clamp(54px,8vw,92px);filter:drop-shadow(0 10px 8px rgba(0,0,0,.3));animation:bob 4s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 6deg))}}
.lobby{display:grid;gap:18px}
@media (min-width:880px){.lobby{grid-template-columns:.9fr 1.1fr;align-items:start}}
.chefs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.chefpick{border:0;background:transparent;padding:0;border-radius:50%;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.chefpick svg{width:100%;height:auto;aspect-ratio:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
.chefpick[aria-pressed="true"]{transform:scale(1.12) translateY(-4px)}
.chefpick[aria-pressed="true"] svg{outline:4px solid var(--tomato);outline-offset:2px;border-radius:50%}
.me-row{display:flex;align-items:center;gap:14px}
.me-row .big-chef{width:96px;height:96px;flex:none;animation:bob 3.4s ease-in-out infinite}
.field{flex:1;display:grid;gap:6px}
.field input{width:100%;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--cream);font-size:1.1rem}
.field input:focus{border-color:var(--tomato);outline:none}
.actions{display:grid;gap:14px}
.join-code{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot{width:58px;height:58px;border-radius:16px;background:var(--cream2);display:grid;place-items:center;border:2px dashed var(--line);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.slot.filled{border-style:solid;border-color:transparent;background:var(--cream);box-shadow:0 4px 0 var(--line)}
.slot svg{width:44px;height:44px}
.slot.pop{animation:popin .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popin{from{transform:scale(.3)}}
.palette{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.palette button{width:50px;height:50px;border:0;border-radius:14px;background:var(--cream2);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;transition:transform .15s}
.palette button:active{transform:translateY(4px);box-shadow:none}
.palette svg{width:38px;height:38px}
.rooms{display:grid;gap:8px;max-height:230px;overflow:auto}
.room-row{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:16px;padding:8px 10px;animation:slidein .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{transform:translateX(-16px);opacity:0}}
.room-row .code{display:flex;gap:2px}
.room-row .code svg{width:26px;height:26px}
.room-row .host svg{width:34px;height:34px}
.room-row .btn{padding:8px 14px;font-size:.95rem;margin-left:auto}
.empty{padding:14px;border-radius:16px;border:2px dashed var(--line);text-align:center;color:var(--muted);font-size:.95rem}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}

/* ---------- waiting room ---------- */
.wait{display:grid;gap:18px}
@media (min-width:900px){.wait{grid-template-columns:1.35fr .8fr}}
.wait-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.bigcode{display:flex;gap:6px}
.bigcode span{width:62px;height:62px;border-radius:18px;background:var(--cream);display:grid;place-items:center;box-shadow:0 5px 0 var(--line);animation:popin .5s cubic-bezier(.34,1.56,.64,1) both}
.bigcode span:nth-child(2){animation-delay:.08s}.bigcode span:nth-child(3){animation-delay:.16s}.bigcode span:nth-child(4){animation-delay:.24s}
.bigcode svg{width:48px;height:48px}
.codetext{font-size:.9rem;color:var(--muted)}
.tablewrap{position:relative;width:min(100%,500px);aspect-ratio:1;margin:34px auto 56px}
.rtable{position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6b4560,#4a2c42 70%);box-shadow:inset 0 -12px 0 rgba(0,0,0,.25),0 20px 40px -10px rgba(0,0,0,.5)}
.rtable .plate{position:absolute;inset:30%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
.seat{position:absolute;width:27%;display:grid;justify-items:center;text-align:center;transform:translate(-50%,-50%);gap:2px}
.seat .av{width:78%;aspect-ratio:1;position:relative}
.seat .av svg{width:100%;height:100%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))}
.seat.join .av{animation:seatpop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes seatpop{0%{transform:scale(0) rotate(-20deg)}}
.seat .nm{font-weight:600;background:var(--glass);padding:2px 10px;border-radius:999px;font-size:.92rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .st{font-size:.8rem;padding:1px 8px;border-radius:999px;background:var(--cream2);color:var(--muted)}
.seat .st.ready{background:var(--basil);color:#fff;animation:readybounce .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes readybounce{0%{transform:scale(.5)}}
.seat.vacant .av{border-radius:50%;border:3px dashed rgba(255,255,255,.55);display:grid;place-items:center;color:#fff;font-size:.85rem;background:rgba(255,255,255,.08)}
.seat .av svg.crown{position:absolute;top:-22%;left:-8%;width:46%;height:46%;transform:rotate(-18deg);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.you-tag{position:absolute;bottom:-4px;right:-4px;background:var(--tomato);color:#fff;font-size:.7rem;padding:1px 7px;border-radius:999px}
.say{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);background:#fff;color:#3a2233;padding:6px 10px;border-radius:14px;font-size:.85rem;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 14px -6px rgba(0,0,0,.4);animation:bubble .3s cubic-bezier(.34,1.56,.64,1)}
.say::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
@keyframes bubble{from{transform:translateX(-50%) scale(.3);opacity:0}}
.chat{display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:340px}
.log{overflow:auto;max-height:300px;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.msg{display:flex;gap:8px;align-items:flex-start;animation:slidein .3s both}
.msg svg{width:30px;height:30px;flex:none}
.msg p{background:var(--cream);padding:6px 10px;border-radius:4px 14px 14px 14px;font-size:.92rem}
.msg b{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.msg.sys p{background:transparent;color:var(--muted);font-size:.85rem;padding:2px}
.chatin{display:flex;gap:8px}
.chatin input{flex:1;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--cream)}
.wait-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.note{font-size:.88rem;color:var(--muted);text-align:center;margin-top:6px}

/* countdown */
.count{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(30,12,28,.55);backdrop-filter:blur(4px)}
.count b{font-size:clamp(7rem,24vw,14rem);color:#fff4d6;text-shadow:0 8px 0 #c23a55,0 16px 0 #7b2346;animation:countpop .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes countpop{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}85%{transform:scale(.9);opacity:1}100%{transform:scale(.6);opacity:0}}

/* ---------- table (game preview) ---------- */
.gamebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:#fff}
.gamebar .who{display:flex;gap:4px}
.gamebar .who svg{width:36px;height:36px}
.table{position:relative;width:100%;aspect-ratio:16/10;border-radius:30px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse at 50% 30%,#5a3550,#3e2437 60%,#2f1a2b);box-shadow:inset 0 0 0 8px rgba(0,0,0,.12),var(--shadow)}
.table::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(transparent,rgba(20,8,18,.45));pointer-events:none}
.it{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);will-change:transform;cursor:grab;z-index:2}
.it.drag{cursor:grabbing;z-index:20}
.it .sh{position:absolute;left:12%;right:12%;bottom:2%;height:22%;border-radius:50%;background:rgba(15,4,12,.45);filter:blur(3px);transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.it .bd{position:absolute;inset:0;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.it .bd svg{width:100%;height:100%;animation:idle 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes idle{50%{transform:rotate(2.5deg) scale(1.025)}}
.it.drag .bd{transform:translateY(-14%) scale(1.14)}
.it.drag .sh{transform:scale(.8) translateY(18%);opacity:.6}
.it.cooked .bd svg{filter:saturate(.85) brightness(.82) sepia(.25)}
.fixture{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.fixture svg{width:100%;height:100%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.4))}
.fixture.glow svg{filter:drop-shadow(0 0 16px rgba(255,220,120,.9)) drop-shadow(0 12px 10px rgba(0,0,0,.4))}
.order{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;color:#3a2233;border-radius:0 0 20px 20px;padding:8px 16px 10px;display:flex;gap:14px;z-index:15;box-shadow:0 10px 20px -8px rgba(0,0,0,.5)}
.order div{display:flex;align-items:center;gap:4px;font-weight:700;font-size:1.05rem}
.order svg{width:36px;height:36px}
.order .ok{color:var(--basil-d)}
.score{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#d67a3a;color:#fff;border-radius:14px;padding:4px 18px;font-weight:700;letter-spacing:1px;z-index:15;box-shadow:0 4px 0 #9c4f1f}
.score.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{50%{transform:translateX(-50%) scale(1.3)}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:25}
.cursor{position:absolute;left:0;top:0;z-index:30;pointer-events:none;transition:transform .08s linear;display:flex;align-items:center;gap:4px}
.cursor svg{width:30px;height:30px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.cursor span{background:#fff;color:#3a2233;font-size:.75rem;padding:1px 8px;border-radius:999px}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(1.6rem,5vw,3rem);font-weight:700;color:#fff4d6;text-shadow:0 4px 0 #c23a55,0 8px 20px rgba(0,0,0,.4);z-index:40;pointer-events:none;animation:toast 1.2s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.hint{color:#fff;opacity:.85;font-size:.92rem;margin-top:10px;text-align:center}

/* ---------- match ---------- */
.match{display:grid;gap:14px}
.mhead{display:flex;align-items:center;gap:14px;color:#fff;flex-wrap:wrap}
.mhead h2{font-size:1.6rem;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.dishmini{width:78px;flex:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
.dish{position:relative;aspect-ratio:1}
.dish>svg{width:100%;height:100%}
.dish>span{position:absolute;width:42%;transform:translate(-50%,-50%)}
.dish>span>.ia,.dish>span>.chop,.dish>span>.mash{width:100%}
.dish span svg{width:100%;height:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:3px 12px 3px 4px;font-size:.9rem}
.chip svg{width:26px;height:26px}
.chip.now{background:#fff;color:#3a2233;animation:chipbob 1.2s ease-in-out infinite}
@keyframes chipbob{50%{transform:translateY(-3px)}}
.chip.done{background:var(--basil);color:#fff}
.chip b{font-weight:700}
.mgrid{display:grid;gap:14px}
@media (min-width:920px){.mgrid{grid-template-columns:1fr 290px;align-items:start}}
.stbox{padding:0 0 4px;overflow:hidden}
.stbox .btn.big{padding:12px 20px;font-size:1.15rem}
.rib{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--c,#F2B447);color:#3a2233;transition:background .3s}
.rib b{font-size:1.4rem;white-space:nowrap}
.rib span{font-size:.98rem;flex:1}
.ringbox{position:relative;width:48px;height:48px;flex:none}
.ring{width:48px;height:48px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:rgba(58,34,51,.15)}
.ring .fg{stroke:#2f8a36;stroke-dasharray:113.1;stroke-linecap:round;transition:stroke .3s}
.ringbox em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.95rem}
.scene{position:relative;aspect-ratio:16/10;width:min(100%,calc(46vh * 1.6));margin:0 auto;border-radius:0 0 18px 18px;background:radial-gradient(ellipse at 50% 35%,#5a3550,#3e2437 65%,#2f1a2b);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.obj{position:absolute}
.obj>svg{width:100%;height:auto;display:block;overflow:visible}
.ctrl{padding:12px 16px 14px;display:grid;gap:10px;width:min(100%,calc(46vh * 1.6 + 60px));margin:0 auto}
.ctrl .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl .row .btn.big{flex:1;min-width:180px}
.swing{position:relative;height:38px;border-radius:999px;overflow:hidden;background:#F26B5E;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.swing i{position:absolute;top:0;bottom:0}
.zy{background:#FFC933}.zg{background:#4CAF50}
.needle{position:absolute;top:-2px;bottom:-2px;width:10px;margin-left:-5px;background:#fff;border-radius:5px;box-shadow:0 0 0 3px #3a2233}
.pips{display:flex;gap:6px}
.pips i{width:20px;height:20px;border-radius:50%;background:var(--cream2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.pips i.g{background:#4CAF50}.pips i.y{background:#FFC933}.pips i.r{background:#F26B5E}
.slice{position:absolute;width:6.8%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--b) 0 36%,var(--a) 40%);box-shadow:0 5px 0 rgba(0,0,0,.22);transform:translate(-50%,-50%)}
.slice.r{border-radius:45% 55% 38% 62%}
.meter{position:relative;height:30px;border-radius:999px;overflow:hidden;background:var(--cream2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:background .2s}
.meter.seg{display:flex}
.meter.seg span{height:100%}
.meter .nd{position:absolute;top:-3px;bottom:-3px;width:10px;margin-left:-5px;background:#fff;border-radius:5px;box-shadow:0 0 0 3px #3a2233;transition:left .08s linear}
.mlabel{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:4px}
.state{font-weight:700;padding:2px 12px;border-radius:999px;color:#fff}
.state.g{background:#2f8a36}.state.y{background:#E0A412}.state.r{background:#D63B32;animation:shake .3s infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.lamps{display:flex;gap:6px}
.lamps i{width:22px;height:22px;border-radius:50%;background:var(--cream2)}
.lamps i.on.r{background:#F26B5E;box-shadow:0 0 12px #F26B5E}.lamps i.on.y{background:#FFC933;box-shadow:0 0 12px #FFC933}.lamps i.on.g{background:#4CAF50;box-shadow:0 0 12px #4CAF50}
.heatbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.heatbtns .btn{padding:10px 6px}
.heatbtns .btn.on{--c:#FF7A2F;--d:#C4531A;color:#fff}
.tbars{display:grid;gap:8px}
.tbar{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;border:0;background:transparent;padding:0;text-align:left}
.tbar svg{width:32px;height:32px}
.tbar .meter{height:22px}
.tbar .flag{position:absolute;top:0;bottom:0;width:3px;background:#3a2233}
.tbar b{text-align:right}
.order-bubble{background:#fff;color:#3a2233;border-radius:16px;padding:8px 14px;font-weight:600;box-shadow:0 4px 0 var(--line)}
.flame{position:absolute;transform-origin:50% 100%}
.flame svg{width:100%;height:auto;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.94)}}
.food{position:absolute;transform:translate(-50%,-50%)}
.food svg{width:100%;height:auto;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.bob svg{animation:bobw 1.6s ease-in-out infinite}
@keyframes bobw{50%{transform:translateY(-8%) rotate(4deg)}}
.liquid{position:absolute;border-radius:50%;transition:background .25s}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.75);animation:bub 1.1s ease-in infinite;transform:scale(0)}
@keyframes bub{60%{transform:scale(1)}100%{transform:scale(1.2);opacity:0}}
.scum{position:absolute;width:7%;aspect-ratio:1.5;border-radius:50%;background:radial-gradient(circle at 40% 40%,#EFE6CF,#B9AB84);box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translate(-50%,-50%);cursor:pointer;animation:popin .3s cubic-bezier(.34,1.56,.64,1)}
.spill{position:absolute;opacity:0;transition:opacity .3s;pointer-events:none}
.spill.on{opacity:1}
.spill i{position:absolute;border-radius:50%;background:#fff}
.stream{position:absolute;width:1.6%;border-radius:8px;opacity:0;transition:opacity .1s;transform-origin:top}
.stream.on{opacity:1;animation:streamw .15s infinite alternate}
@keyframes streamw{to{transform:scaleX(.7)}}
.bottle{position:absolute;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1);transform-origin:50% 80%}
.bottle svg{width:100%;height:auto;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.bottle kbd{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);background:#fff;color:#3a2233;border-radius:8px;padding:0 7px;font-size:.8rem;font-family:inherit}
.spop{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:clamp(1.3rem,3.6vw,2.2rem);pointer-events:none;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.4);z-index:20;animation:spop .8s cubic-bezier(.34,1.56,.64,1) forwards}
.spop.g{color:#9BF59C}.spop.y{color:#FFD95A}.spop.r{color:#FF8A7E}.spop.w{color:#fff}
@keyframes spop{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}25%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
.banner-ov{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:rgba(30,12,28,.55);z-index:30;color:#fff4d6;text-align:center;animation:fadein .2s}
.banner-ov b{font-size:clamp(2rem,6vw,3.6rem);text-shadow:0 5px 0 #c23a55}
.banner-ov .dish{width:clamp(110px,22%,190px);animation:popin .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes fadein{from{opacity:0}}
.sboard h3{margin-bottom:10px}
.liverank{background:var(--butter);color:#3a2233;font-weight:700;border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--butter-d)}
@media (hover:none){kbd{display:none}}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px;border-radius:14px;transition:background .3s}
.prow.me{background:var(--cream2)}
.prow svg{width:40px;height:40px}
.prow .nm{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .dots{display:flex;gap:3px;margin-top:2px}
.prow .dots i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.prow .dots i.f{background:var(--basil)}
.prow .sc{font-weight:700;font-size:1.1rem}
.prow .fin{font-size:.75rem;color:#fff;background:var(--basil);border-radius:999px;padding:1px 8px}
/* results */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0 18px}
.pod{display:grid;justify-items:center;gap:4px;width:min(30%,170px);text-align:center}
.pod svg.av{width:72%;height:auto;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3));animation:popin .6s cubic-bezier(.34,1.56,.64,1) both}
.pod .blk{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:center;font-size:1.8rem;font-weight:700;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}}
.pod.p1 .blk{height:120px;background:linear-gradient(#FFD95A,#E0A412)}.pod.p2 .blk{height:88px;background:linear-gradient(#DCE3EC,#9AA6B6)}.pod.p3 .blk{height:66px;background:linear-gradient(#F0B27A,#C27A3A)}
.pod .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font-size:1.4rem;font-weight:700}
.res-grid{display:grid;gap:16px}
@media (min-width:900px){.res-grid{grid-template-columns:1.2fr 1fr}}
.rank-row{display:grid;grid-template-columns:32px 40px 1fr auto auto;gap:10px;align-items:center;padding:8px;border-radius:14px}
.rank-row.me{background:var(--cream2)}
.rank-row svg{width:40px;height:40px}
.rank-row .tot{font-size:.85rem;color:var(--muted)}
.mybreak{display:grid;gap:8px}
.mybreak div{display:grid;grid-template-columns:34px 1fr 1.3fr 40px;gap:8px;align-items:center}
.mybreak svg{width:34px;height:34px}
/* ---------- kitchen play screen ---------- */
.play{user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;--vp:clamp(340px,calc(100vh - 360px),660px)}
.pmain{padding:12px;display:grid;gap:10px;min-width:0}
.phead{display:flex;align-items:center;gap:10px;min-width:0}
.ptimer{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:14px;padding:4px 12px;flex:none}
.ptimer span{font-size:.8rem;color:var(--muted)}
.ptimer b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.ptimer b.low{color:var(--tomato);animation:shake .4s infinite}
.plist{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.pl{flex:none;display:grid;grid-template-columns:auto 30px auto auto;gap:6px;align-items:center;padding:3px 10px 3px 6px;border-radius:999px;background:var(--cream);font-size:.85rem}
.pl.me{box-shadow:0 0 0 2px var(--tomato)}
.pl svg{width:30px;height:30px}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;max-width:110px}
.pl .nm small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.pl b{font-size:1rem}
.vtabs{display:flex;background:var(--cream2);border-radius:14px;padding:3px;flex:none}
.vtabs button{border:0;background:transparent;border-radius:11px;padding:6px 12px;font-weight:600;font-size:.92rem;position:relative}
.vtabs button[aria-pressed="true"]{background:var(--cream);box-shadow:0 2px 0 var(--line)}
.vtabs i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--tomato);color:#fff;font-size:.7rem;font-style:normal;display:grid;place-items:center;padding:0 4px}
.vtabs i:empty{display:none}
.phead .quit{padding:6px 12px;font-size:.85rem;flex:none}
/* orders: top-left box */
.orders{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:stretch}
.tickets{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px}
.ticket{flex:0 0 auto;width:108px;border:0;border-radius:16px;background:#fff;color:#3a2233;padding:6px 8px 8px;display:grid;justify-items:center;gap:2px;box-shadow:0 4px 0 var(--line);position:relative;transition:transform .2s cubic-bezier(.34,1.56,.64,1);animation:popin .45s cubic-bezier(.34,1.56,.64,1)}
.ticket.sel{transform:translateY(-3px);box-shadow:0 0 0 3px var(--tomato),0 6px 0 var(--line)}
.ticket .dish{width:44px}
.ticket .tn{font-size:.76rem;font-weight:600;text-align:center;line-height:1.15;min-height:2.3em}
.ticket .pat{width:100%;height:7px;border-radius:4px;background:#eee;overflow:hidden}
.ticket .pat i{display:block;height:100%;border-radius:4px}
.ticket .tier{position:absolute;top:4px;right:6px;font-size:.62rem;color:#b08}
.howto{display:flex;flex-direction:column;gap:6px;background:var(--cream);border-radius:16px;padding:8px 12px;min-width:0}
.howto h3{font-size:1rem}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:3px;background:var(--glass);border-radius:12px;padding:3px 8px;font-size:.78rem;position:relative}
.step svg,.step .ia,.step .chop,.step .mash{width:28px;height:28px}
.step .arr{color:var(--muted);font-size:.8rem}
.step.ok{background:#D9F2D4;color:#3a2233}
.step.ok::after{content:"✓";position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--basil);color:#fff;display:grid;place-items:center;font-size:.7rem}
.step.ready{background:#FFF0C2;color:#3a2233}
/* sliding views: kitchen <-> plate */
.vport{position:relative;height:var(--vp);border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#5a3550,#3e2437 65%,#2f1a2b);box-shadow:inset 0 0 0 6px rgba(0,0,0,.12)}
.track{display:flex;width:200%;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.track.p{transform:translateX(-50%)}
.view{width:50%;height:100%;position:relative;padding:16px 64px}
.vedge{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:120px;border:0;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center;gap:2px;z-index:3;transition:background .2s}
.vedge:hover,.vedge.hot{background:rgba(255,201,51,.85);color:#3a2233}
.vedge.r{right:10px}.vedge.l{left:10px}
.vedge span{writing-mode:vertical-rl}
.vlabel{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#fff;opacity:.75;font-size:.85rem;font-weight:600;white-space:nowrap}
/* station blocks */
.stgrid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px;padding-top:18px}
.stblock{position:relative;border:0;border-radius:22px;background:var(--c);color:#3a2233;display:grid;grid-template-rows:1fr auto auto;justify-items:center;align-items:center;padding:10px 8px 8px;min-height:0;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),0 10px 18px -8px rgba(0,0,0,.5);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,opacity .2s,filter .2s;touch-action:manipulation}
.stblock:hover{transform:translateY(-3px)}
.stblock .stico{width:70%;height:100%;min-height:0;display:grid;place-items:center}
.stblock .stico svg{width:100%;height:100%;max-height:110px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.3))}
.stblock b{font-size:1.1rem;line-height:1.1}
.stblock small{font-size:.78rem;opacity:.8}
.stblock .acc{position:absolute;top:8px;left:8px;display:flex;gap:2px;flex-wrap:wrap;max-width:46%}
.stblock .acc span{width:22px;height:22px;background:rgba(255,255,255,.45);border-radius:7px;padding:1px}
.stblock .acc svg{width:100%;height:100%}
.stblock .num{position:absolute;top:8px;right:10px;font-size:.75rem;font-weight:700;opacity:.55}
.stblock.can{box-shadow:0 0 0 4px #6EE07A,0 0 26px 4px rgba(110,224,122,.7),inset 0 -8px 0 rgba(0,0,0,.14);animation:canpulse 1s ease-in-out infinite}
@keyframes canpulse{50%{transform:translateY(-3px) scale(1.02)}}
.stblock.no{opacity:.45;filter:saturate(.5)}
.stblock.over,.platedrop.over,.hand.over,.trash.over{outline:4px dashed #fff;outline-offset:3px}
/* plate view */
.platev{height:100%;display:grid;grid-template-columns:150px 1fr 170px;gap:14px;align-items:center;padding-top:14px}
.platedrop{position:relative;justify-self:center;width:min(100%,calc(var(--vp) - 70px));aspect-ratio:1;border-radius:50%;transition:transform .2s}
.platedrop .dish{width:100%}
.platedrop .dish>span{width:34%}
.platedrop.empty>svg{opacity:.35}
.platedrop .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-weight:600;padding:22%;pointer-events:none}
.platedrop.can{box-shadow:0 0 0 6px #6EE07A,0 0 40px 8px rgba(110,224,122,.6)}
.pside{display:grid;gap:10px;align-content:center}
.pside .btn{width:100%}
.pside .pc{background:rgba(255,255,255,.92);color:#3a2233;border-radius:14px;padding:6px 10px;font-size:.85rem;text-align:center;font-weight:600}
.sinkblock{--c:#8CD0F2}
.sinkmini{display:none}
.sinkblock.stblock{height:170px}
/* station screen (opens over the views) */
.sview{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 35%,#5a3550,#3e2437 65%,#2f1a2b);animation:svin .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sview[hidden]{display:none}
@keyframes svin{from{transform:scale(.92);opacity:0}}
.sview .rib2{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--c,#F2B447);color:#3a2233;font-weight:600;flex:none}
.sview .rib2 b{font-size:1.15rem}
.sview .rib2 span{font-size:.88rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sview .rib2 .btn{padding:6px 12px;font-size:.85rem}
.scenebox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;padding:6px}
.sview .scene{width:min(100cqw,160cqh);aspect-ratio:16/10;height:auto;border-radius:18px;margin:0}
.sview .ctrl{flex:none;width:min(calc(100% - 16px),660px);margin:0 auto 8px;padding:10px 16px 12px;background:var(--glass);color:var(--ink);border-radius:18px;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.sview .ctrl:empty{display:none}
.play.busy .vtabs,.play.busy .vedge{pointer-events:none;opacity:.5}
/* hand: you can hold one thing */
.handbar{display:flex;align-items:center;justify-content:center;gap:12px}
.handbar .hlabel{font-size:.85rem;color:var(--muted);font-weight:600}
.hand{position:relative;min-width:230px;height:78px;border-radius:20px;background:var(--cream);border:3px dashed var(--line);display:flex;align-items:center;gap:10px;padding:6px 14px;transition:background .2s}
.hand.full{border-style:solid;border-color:var(--butter);background:#FFF6D8;color:#3a2233;cursor:grab;touch-action:none}
.hand .ia,.hand .chop,.hand .mash{width:58px;height:58px;flex:none;pointer-events:none}
.hand .hn{font-weight:600;line-height:1.15}
.hand .hn small{display:block;font-weight:400;font-size:.75rem;color:#86697a}
.hand .q{width:10px;height:10px;border-radius:50%;flex:none}
.hand .empty-h{color:var(--muted);font-size:.88rem}
.trash{width:58px;height:58px;border:0;border-radius:16px;background:var(--cream2);font-size:1.4rem;box-shadow:0 4px 0 var(--line)}
.trash:disabled{opacity:.4}
/* drag ghost */
.ghost{position:fixed;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;z-index:100;pointer-events:none;filter:drop-shadow(0 12px 10px rgba(0,0,0,.45));transform-origin:center}
.ghost .ia,.ghost .chop,.ghost .mash{width:100%;height:100%}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.drawer{position:sticky;top:10px;align-self:start;height:calc(100vh - 80px);width:250px;transition:width .35s cubic-bezier(.2,.8,.2,1);border-radius:28px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);overflow:hidden}
.drawer.closed{width:46px}
.dtab{position:absolute;left:0;top:50%;transform:translateY(-50%);width:46px;height:110px;border:0;border-radius:0 18px 18px 0;background:var(--butter);color:#3a2233;font-size:1.3rem;font-weight:700;box-shadow:4px 0 0 var(--butter-d);z-index:2;writing-mode:vertical-rl}
.drawer:not(.closed) .dtab{left:auto;right:0;border-radius:18px 0 0 18px;box-shadow:-4px 0 0 var(--butter-d)}
.dbody{position:absolute;inset:0 46px 0 0;padding:14px 10px 14px 14px;overflow-y:auto;transition:opacity .2s}
.drawer.closed .dbody{opacity:0;pointer-events:none}
.dbody h3{margin-bottom:6px}
.dcat{font-size:.85rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ding{border:0;background:var(--cream);border-radius:14px;padding:6px 2px 4px;display:grid;justify-items:center;gap:0;font-size:.68rem;line-height:1.1;box-shadow:0 3px 0 var(--line);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.ding:hover{transform:translateY(-3px) rotate(-2deg)}
.ding:active{transform:translateY(2px)}
.ding svg{width:42px;height:42px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.ding{touch-action:pan-y}
/* ---------- stages ---------- */
.stagepill{flex:none;background:#E8F4E4;color:#2f6a33;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;white-space:nowrap}
.stagepill.rush{background:#FF5A4E;color:#fff;animation:shake .5s infinite}
.stblock.locked{filter:grayscale(1) brightness(.75);opacity:.55;cursor:not-allowed}
.stblock.locked:hover{transform:none}
.stblock .lock{position:absolute;inset:auto 8px 8px 8px;font-size:.78rem;font-weight:700;color:#fff;background:rgba(30,12,28,.7);border-radius:10px;padding:2px 6px}
.stblock .lock:empty{display:none}
.ding{position:relative}
.ding .dl{position:absolute;top:2px;right:2px;font-style:normal;font-size:.7rem;display:flex;align-items:center;gap:1px}
.ding .dl:empty{display:none}
.ding .dl i{font-style:normal;background:#3E8EDE;color:#fff;border-radius:6px;padding:0 3px;font-size:.6rem}
.ding .dl svg.mini{width:16px;height:16px}
.ding.locked{opacity:.35;filter:grayscale(1)}
.ding.mate{opacity:.6;background:var(--cream2)}
.ding.mate svg:not(.mini){filter:grayscale(.6)}
.ding.asked{box-shadow:0 0 0 3px #3E8EDE,0 3px 0 var(--line);animation:canpulse .8s ease-in-out infinite}
.ding.asked .dl i{background:#FF5A4E}
.stagebanner{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(30,12,28,.6);animation:fadein .25s;cursor:pointer;text-align:center;color:#fff4d6;padding:12px}
.stagebanner[hidden]{display:none}
.stagebanner>div{display:grid;gap:8px;justify-items:center;animation:popin .5s cubic-bezier(.34,1.56,.64,1)}
.stagebanner small{font-size:1rem;opacity:.85}
.stagebanner b{font-size:clamp(2rem,5vw,3.2rem);text-shadow:0 5px 0 #c23a55}
.stagebanner.rush b{color:#FFD95A}
.stagebanner p{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-weight:600}
.stagebanner p span{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);border-radius:12px;padding:4px 10px}
.stagebanner p span svg{width:40px;height:28px}
.stagebanner p.ni span{padding:2px}.stagebanner p.ni svg{width:34px;height:34px}
.ticket.rush{box-shadow:0 0 0 3px #FF5A4E,0 4px 0 var(--line)}
.ticket.rush::after{content:"×1.5";position:absolute;bottom:14px;right:4px;background:#FF5A4E;color:#fff;font-size:.6rem;border-radius:6px;padding:0 4px;font-weight:700}
/* ---------- team 2v2 ---------- */
.pl.team{grid-template-columns:auto auto auto auto;box-shadow:inset 0 0 0 2px var(--tc)}
.pl.team svg{width:26px;height:26px;margin-right:-8px}
.pl.team .nm{margin-left:10px;max-width:150px}
.pl.team b{color:var(--tc);font-size:1.15rem}
.pl.team.me{background:#fff;box-shadow:inset 0 0 0 3px var(--tc)}

<script>
/* ================= helpers ================= */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(s,n=40)=>String(s||'').replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,'').trim().slice(0,n);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const VB={pan:'0 0 160 120'};
const art=(k,cls='',label='')=>`<svg class="ic ${cls}" viewBox="${VB[k]||'0 0 120 120'}" ${label?`role="img" aria-label="${esc(label)}"`:'aria-hidden="true"'}><use href="#a-${k}"/></svg>`;
const chef=(i,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 120 120" aria-hidden="true"><use href="#c-${(+i||0)%6}"/></svg>`;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function mergePatch(o,p){const n={...o};for(const k in p){if(p[k]===null)delete n[k];else n[k]=p[k]}return n}

/* ================= chef portraits (generated into the sprite) ================= */
const shade=(h,f=.82)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*f).toString(16).padStart(2,'0')).join('');
const CHEFS=[
  {bg:'#FFD6C9',skin:'#F7CFA8',hair:'#3A2233',scarf:'#FF5A4E',hat:'toque'},
  {bg:'#D6EAFF',skin:'#E3AE84',hair:'#1F1420',scarf:'#3E8EDE',hat:'toque'},

/* ================= NETWORK ADAPTER =================
   1) Published on claude.ai  -> the platform "room" capability (real multiplayer)
   2) Served by server.js     -> Socket.IO (real multiplayer on your own host)
   3) Anything else           -> offline demo with bot chefs                     */
const NET={mode:'offline',lobbyPeers:[],lobbySubs:new Set(),lobbyP:{},you:null,gameSubs:new Set(),
  async init(){
    if(window.claude&&typeof window.claude.use==='function'){
      try{const r=await window.claude.use('room');
        if(r){this.mode='claude';this.r=r;
          r.onPeers(ch=>this._lobby(ch.peers.map(p=>({id:p.peer,isMe:p.sameTab,p:p.presence||{}}))),()=>{});
          r.onConnection(c=>setConn(c?'on':'off'),()=>setConn('off'));
          if(Object.keys(this.lobbyP).length)r.presence(this.lobbyP).catch(()=>{});
          return}}catch(e){}
    }else if(!window.claude&&location.protocol.startsWith('http')){
      try{await loadScript('/socket.io/socket.io.js',3500);
        const s=window.io();this.mode='socket';this.s=s;this.rooms={};
        s.on('connect',()=>{setConn('on');s.emit('lobby:set',this.lobbyP);Object.values(this.rooms).forEach(rm=>s.emit('room:join',{code:rm.code,p:rm.p}))});
        s.on('disconnect',()=>setConn('off'));
        s.on('lobby:peers',l=>this._lobby(l.map(x=>({id:x.id,isMe:x.id===s.id,p:x.p||{}}))));
        s.on('room:peers',({code,peers})=>{const rm=this.rooms[code];if(rm)rm._emit(peers.map(x=>({id:x.id,isMe:x.id===s.id,p:x.p||{}})))});
        s.on('room:full',code=>{const rm=this.rooms[code];if(rm)rm._full&&rm._full()});
        ['game:you','game:recv','game:ask','game:expired','game:stage','game:prank','game:gold','game:goldnew','game:grab'].forEach(ev=>s.on(ev,d=>{if(ev==='game:you')this.you=d;this.gameSubs.forEach(f=>f(ev,d))}));
        return}catch(e){}
    }
    this.mode='offline';setConn('offline');
  },
  _lobby(list){this.lobbyPeers=list;this.lobbySubs.forEach(f=>f(list))},
  onLobby(f){this.lobbySubs.add(f);f(this.lobbyPeers);return()=>this.lobbySubs.delete(f)},
  setLobby(patch){this.lobbyP=mergePatch(this.lobbyP,patch);
    if(this.mode==='claude')this.r.presence(patch).catch(()=>{});
    else if(this.mode==='socket')this.s.emit('lobby:set',patch)},
  async join(code,p){
    if(this.mode==='claude'){const nr=await this.r.join(code);let subs=new Set(),last=[];
      nr.onPeers(ch=>{last=ch.peers.map(x=>({id:x.peer,isMe:x.sameTab,p:x.presence||{}}));subs.forEach(f=>f(last))},()=>{});
      await nr.presence(p).catch(()=>{});
      return{code,presence:patch=>nr.presence(patch).catch(()=>{}),onPeers(f){subs.add(f);f(last);return()=>subs.delete(f)},leave:()=>nr.leave().catch(()=>{})}}
    if(this.mode==='socket'){const s=this.s;const rm={code,p:{...p},subs:new Set(),last:[],
        _emit(l){this.last=l;this.subs.forEach(f=>f(l))},
        presence(patch){this.p=mergePatch(this.p,patch);s.emit('room:set',{code,patch})},
        onPeers(f){this.subs.add(f);f(this.last);return()=>this.subs.delete(f)},
        leave(){s.emit('room:leave',code);delete NET.rooms[code]}};
      this.rooms[code]=rm;s.emit('room:join',{code,p});return rm}
    return offlineRoom(code,p);
  }
};
function loadScript(src,ms){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);setTimeout(rej,ms)})}
function setConn(state){const c=$('#conn');c.classList.toggle('on',state==='on');
  $('#connText').textContent=state==='on'?(NET.mode==='claude'?'ออนไลน์ในห้องนี้':'ออนไลน์'):state==='off'?'กำลังเชื่อมต่อใหม่…':'โหมดออฟไลน์ (บอท)'}

function offlineRoom(code,p){
  const me={id:'me',isMe:true,p:{...p}};const subs=new Set();
  const emit=()=>{const l=[{...me,p:{...me.p}}];subs.forEach(f=>f(l))};
  return{code,offline:true,presence(patch){me.p=mergePatch(me.p,patch);emit()},
    onPeers(f){subs.add(f);f([{...me,p:{...me.p}}]);return()=>subs.delete(f)},leave(){}};
}

const FX3={on:false,tool:null,st:{},
  start(tool,it){this.end();this.tool=tool;this.st={};
    const L={pan:['sizzle',.4],grill:['crackle',.7],oven:['oven',.7],steamer:['steam',.8]}[tool];if(L)SFX.loop(...L);
    if(!W3D.ready||!document.querySelector('.vport.k3d'))return;this.on=true;W3D.S.cook.start(tool,it)},
  hit(k){SFX.play({chop:'chop',pound:'pound',mix:'mix',toss:'toss',flip:'flip',water:'water',open:this.tool==='oven'?'ding':'steam'}[k]);if(this.on)W3D.S.cook.hit(k)},
  set(o){this.sound(o);if(this.on)W3D.S.cook.set(o)},
  sound(o){const t=this.tool,st=this.st;
    if(t==='pan'&&o.heat!=null)SFX.loop('sizzle',.25+o.heat*.75);
    if(t==='fryer'&&o.down!=null&&o.down!==st.down){st.down=o.down;if(o.down)SFX.play('dip');SFX.loop('fry',o.down?1:0)}
    if(t==='pot'&&o.level!=null)SFX.loop('boil',Math.min(1,o.level*1.1));
    if(t==='grill'&&o.burn!=null)SFX.loop('sizzle',.3+Math.min(.7,o.burn));
    if(t==='steamer'&&o.water!=null)SFX.loop('steam',o.water>.18?.8:.12);
    if(o.burn>.05&&!st.burnt){st.burnt=true;SFX.play('burnt')}},
  end(){SFX.stopLoops();this.tool=null;if(this.on){W3D.S.cook.end();this.on=false}}};
const W3D={ready:false,k:null,S:null,cv:null,
  off:()=>{try{return sessionStorage.getItem('wc_2d')==='1'||/[?&]2d\b/.test(location.search)}catch(e){return /[?&]2d\b/.test(location.search)}},
  async init(){if(!window.Kit3D||!window.buildKitchen||this.off())return;this.loading=true;this.wait=new Promise(r=>this._done=r);
    try{const cv=document.createElement('canvas');cv.id='c3d';cv.setAttribute('aria-hidden','true');this.cv=cv;

      document.addEventListener('visibilitychange',()=>{if(document.hidden)k.stop();else k.start()});
      if(S.screen!=='match')this.toBg();this.setLow(store('wc_low')===true);k.start();this.watchFps();

  // light graphics: chosen by the player (remembered on this device), or switched on once automatically on a slow machine
  setLow(v){if(!this.k)return;this.k.setLow(v);const b=$('#gq');if(b){b.hidden=false;b.textContent=v?'ภาพเบา':'ภาพสวย';b.classList.toggle('on',!!v)}},
  watchFps(){let n=0,f0=null,slow=0;const t=setInterval(()=>{if(!this.k||document.hidden){f0=null;return}if(this.k.low||store('wc_low')!==null){clearInterval(t);return}
    const f=this.k.frames||0;if(f0!==null){n++;if(n>2&&f-f0<24)slow++}f0=f;if(n<8)return;clearInterval(t);if(slow>=4){this.setLow(true);toast('เครื่องนี้ภาพกระตุก เลยเปิด "ภาพเบา" ให้ (กดปุ่มบนขวาเพื่อเปลี่ยน)')}},1000)},
  toBg(){if(!this.ready)return;const k=this.k;k.onFrame=null;this.cv.className='bg3d';document.body.insertBefore(this.cv,document.querySelector('.veil'));document.body.classList.add('bg3d');
    k.tw=null;k.orbit={c:[6,1,-1.5],r:19,h:9.5,a:0,speed:.16,sway:.55};k.cam.fov=40},
  toVport(vp){if(!this.ready)return false;const k=this.k;k.orbit=null;this.cv.className='vp3d';vp.prepend(this.cv);document.body.classList.remove('bg3d');k.setCam(this.S.shots.kitchen);return true},
  shot(name,side,lift){if(!this.ready)return;const s=name.startsWith('st:')?this.S.shots.station(name.slice(3),side||0,lift||0):this.S.shots[name];if(s)this.k.flyTo(s,650)},
  // keep each HTML hotspot glued to its 3D group, and mirror the hotspot's state (locked / can / over / hover) in 3D
  bind(map){const k=this.k,G=this.S.groups,cache=new Map();
    k.onFrame=vp=>{for(const [el,gid,only] of map()){if(!el)continue;const list=only?[only]:(G[gid]||[]);if(!list.length)continue;
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const it of list){const r=k.rectOf(it,vp);x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h)}
      const css=`left:${x0|0}px;top:${y0|0}px;width:${(x1-x0)|0}px;height:${(y1-y0)|0}px`;if(cache.get(el)!==css){cache.set(el,css);el.style.cssText=el.style.cssText.replace(/(left|top|width|height):[^;]*;?/g,'')+';'+css}
      const c=el.classList,lock=c.contains('locked'),glow=c.contains('over')?[.3,.3,.12]:c.contains('can')?[.1,.28,.04]:el.matches(':hover')?[.09,.07,.03]:[0,0,0];
      for(const it of (G[gid]||[])){it.tint=lock?[.62,.58,.66,.9]:it.baseTint;it.glow=glow}}}},

};

    $('#waitnote').textContent=keep?(keep.length===1?'จบทัวร์นาเมนต์!':`ผ่านเข้ารอบต่อไป ${keep.length} คน`):allDone?'กำลังสรุปผล…':`รออีก ${list.filter(x=>!x.done).length} คนหมดเวลา…`;
    const iHost=M.host&&M.host.isMe;const hb=$('#hostbtns');
    // the host decides who goes through once everyone has finished (scores come from the server)
    if(iHost&&!res&&allDone&&!published){published=true;const kept=list.slice(0,keepN).map(x=>x.m.key);S.room.presence({tour:{...tour,res:{round:tour.round,keep:kept}}})}
    if(iHost&&res&&hb.dataset.on!==String(tour.round)){hb.dataset.on=tour.round;
      hb.innerHTML=keep.length>1?`<button class="btn red big" id="nextR">เริ่มรอบที่ ${+tour.round+1}</button><button class="btn soft" id="toWait">ยกเลิกทัวร์นาเมนต์</button>`:`<button class="btn red big" id="toWait">กลับห้องรอ</button>`;
      const nx=$('#nextR');if(nx)nx.onclick=()=>S.room.presence({phase:'play',gen:Date.now(),dur:S.dur||K.dur,tour:{round:+tour.round+1,alive:keep,out:outs,res:null}});
      $('#toWait').onclick=()=>S.room.presence({phase:'wait',tour:null})}
    if(!iHost)hb.innerHTML='<p class="muted">รอหัวห้องเริ่มรอบต่อไป</p>';
    if(keep&&keep.length===1&&!K.champSfx){K.champSfx=1;SFX.play('fanfare')}};
  onLeave(S.room.onPeers(peers=>{S.peers=peers;draw(peers);followHost(peers)}));
  const iv=setInterval(()=>draw(S.peers||[]),1000);onLeave(()=>clearInterval(iv));
}
function resultsTeam(){const K=S.k,gen=K.gen;const T=[['ทีมแดง','#FF5A4E'],['ทีมฟ้า','#3E8EDE'],['ทีมเขียว','#3DAA48']];
  app.innerHTML=`<div class="res-grid"><section class="card"><h2 style="text-align:center">ผลแข่งทีม ${(S.lastSnap&&S.lastSnap.teams||K.teams||[]).length>2?'2v2v2':'2v2'} · ${Math.round(K.dur/60)} นาที</h2><div class="teamres" id="teamres"></div><p class="note" id="waitnote"></p></section>
    <section class="card"><h3>ทีมของคุณ</h3><div id="myteam"></div><div class="wait-actions" id="hostbtns" style="justify-content:flex-start;margin-top:14px"></div></section></div>`;
  const draw=peers=>{const M=members(peers);const sn=S.lastSnap&&S.lastSnap.gen===gen?S.lastSnap:null;const teams=(sn&&sn.teams)||K.teams||[];if(!teams.length)return;
    const nm=id=>{const m=M.all.find(x=>x.id===id);return m?(clean(m.p.nick,14)||'เชฟ')+(m.isMe?' (คุณ)':m.isBot?' 🤖':''):'—'};const ch=id=>{const m=M.all.find(x=>x.id===id);return chef(m?m.p.chef:0,'av')};
    const top=Math.max(...teams.map(t=>t.score));const tie=teams.filter(t=>t.score===top).length>1;
    const many=teams.length>2;const ord=many?teams.slice().sort((x,y)=>y.score-x.score):teams;
    $('#teamres').innerHTML=ord.map((t,ri)=>`<div class="tcard ${t.score===top&&!tie?'win':''}" style="--tc:${T[t.t][1]}">${t.score===top&&!tie?'<span class="crownw">🏆 ชนะ!</span>':many?`<span class="crownw rk">อันดับ ${ri+1}</span>`:''}<b>${T[t.t][0]}</b><div class="tav">${t.members.map(ch).join('')}</div><span class="tnm">${t.members.map(id=>esc(nm(id))).join(' + ')}</span><span class="pts">${t.score}</span><span class="tot">ส่ง ${t.served} จาน</span></div>`).join(many?'':'<span class="vs">VS</span>')+(tie?'<p class="note" style="flex-basis:100%">เสมอ!</p>':'');
    const mt=teams.find(t=>t.t===K.team);$('#myteam').innerHTML=mt?`<p style="font-size:1.1rem;margin:10px 0">${T[mt.t][0]} ได้ <b style="font-size:2rem">${mt.score}</b> คะแนน · ส่ง <b>${mt.served}</b> จาน</p>`:'';
    const left=M.hum.filter(m=>m.p.gen===gen&&!m.p.done).length;$('#waitnote').textContent=NET.mode==='socket'&&left?`รออีก ${left} คนหมดเวลา…`:'จบเกมแล้ว!';
    const iHost=M.host&&M.host.isMe;const hb=$('#hostbtns');
    if(iHost&&!hb.dataset.on){hb.dataset.on=1;hb.innerHTML=`<button class="btn red big" id="nextR">เล่นอีกรอบ</button><button class="btn soft" id="toWait">กลับห้องรอ</button>`;
      $('#nextR').onclick=()=>S.room.presence({phase:'play',gen:Date.now(),dur:S.dur||K.dur});$('#toWait').onclick=()=>S.room.presence({phase:'wait'})}
    if(!iHost)hb.innerHTML='<p class="muted">รอหัวห้องเริ่มรอบต่อไป</p>'};
  const f=(ev,d)=>{if(ev==='game:you'&&d&&d.snap&&d.snap.gen===gen){S.lastSnap=d.snap;draw(S.peers||[])}};NET.gameSubs.add(f);onLeave(()=>NET.gameSubs.delete(f));
  onLeave(S.room.onPeers(peers=>{S.peers=peers;draw(peers);followHost(peers)}));
}
